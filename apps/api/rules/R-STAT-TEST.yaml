id: R-STAT-TEST
priority: medium
title: Perbandingan tanpa uji statistik
why_flagged: >-
  Analisis membandingkan kelompok/model (mis. selisih rata-rata), tetapi dokumen tidak
  menyebutkan uji statistik atau jumlah pengulangan untuk menilai apakah perbedaannya bermakna
suggested_clarification: >-
  Bagaimana kamu akan memastikan perbedaan yang teramati bukan kebetulan, dan berapa kali
  eksperimen diulang?
basis: >-
  Perbedaan rata-rata dari satu kali percobaan belum menunjukkan perbedaan yang bermakna;
  perbandingan model/kelompok perlu pengulangan dan uji statistik yang sesuai asumsi datanya.
  Perlu ditinjau dosen metodologi.
references:
  - "Demšar, J. (2006). Statistical comparisons of classifiers over multiple data sets. Journal of Machine Learning Research, 7, 1–30."
  - "Wohlin, C., Runeson, P., Höst, M., Ohlsson, M. C., Regnell, B., & Wesslén, A. (2012). Experimentation in software engineering. Springer."
source_types: [methodology]
directions:
  - option: "Uji parametrik (mis. uji t berpasangan)"
    implication: "Butuh asumsi normalitas yang diperiksa dulu, serta jumlah pengulangan (seed/run) yang cukup."
  - option: "Uji nonparametrik (mis. Wilcoxon signed-rank; Friedman untuk banyak model)"
    implication: "Tidak bergantung asumsi normal; lebih umum untuk membandingkan model di beberapa dataset."
  - option: "Perbandingan dilaporkan deskriptif saja"
    implication: "Klaim 'lebih baik' perlu dilunakkan jadi selisih yang teramati, dengan rata-rata dan simpangan baku dari beberapa run."
check:
  kind: missing_terms
  when:
    types: [analysis]
    any_terms: [perbandingan, membandingkan, dibandingkan, rata-rata, selisih, comparison, compare]
  absent: [uji t, t test, t-test, wilcoxon, mann whitney, anova, kruskal, uji statistik, uji beda, p value, p-value, signifikansi statistik, uji signifikansi]
examples:
  fires:
    elements:
      - {type: analysis, content: "Analisis berfokus pada perbandingan nilai rata-rata akurasi kedua model."}
    document_text: "Analisis berfokus pada perbandingan nilai rata-rata akurasi kedua model."
  quiet:
    elements:
      - {type: analysis, content: "Analisis berfokus pada perbandingan nilai rata-rata akurasi kedua model."}
    document_text: "Perbandingan diuji dengan Wilcoxon signed-rank pada 10 kali pengulangan."
defense_question: "Bagaimana Anda tahu perbedaan antar-model itu bermakna dan bukan kebetulan satu kali percobaan? Berapa pengulangan dan uji statistik apa yang dipakai?"

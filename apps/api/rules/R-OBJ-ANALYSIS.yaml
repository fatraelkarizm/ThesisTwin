id: R-OBJ-ANALYSIS
priority: high
title: Tujuan penelitian belum memiliki rencana analisis
why_flagged: >-
  Ditemukan tujuan penelitian, tetapi tidak ditemukan teknik analisis data. Tanpa rencana
  analisis, belum jelas bagaimana tujuan akan dicapai.
suggested_clarification: Teknik analisis apa yang akan dipakai untuk mencapai tujuan ini?
basis: >-
  Setiap tujuan perlu rencana analisis data yang menunjukkan bagaimana tujuan itu dicapai dari data yang dikumpulkan. Perlu ditinjau dosen metodologi.
references:
  - "Creswell, J. W., & Creswell, J. D. (2018). Research design: Qualitative, quantitative, and mixed methods approaches (5th ed.). SAGE."
suggestions:
  - "Untuk tiap tujuan, tuliskan data yang dipakai dan teknik analisisnya dalam satu tabel rencana analisis."
check:
  kind: requires
  source: {types: [objective]}
  target: {types: [analysis]}
examples:
  fires:
    elements:
      - {type: objective, content: "Mengetahui perbedaan hasil belajar sebelum dan sesudah perlakuan.", page: 5}
  quiet:
    elements:
      - {type: objective, content: "Mengetahui perbedaan hasil belajar sebelum dan sesudah perlakuan.", page: 5}
      - {type: analysis, content: "Uji t berpasangan (paired sample t-test).", page: 30}

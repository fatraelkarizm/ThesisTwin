id: R-RQ-OBJ-COUNT
priority: medium
title: Jumlah tujuan tidak sama dengan jumlah rumusan masalah
why_flagged: >-
  Jumlah tujuan penelitian berbeda dengan jumlah rumusan masalah. Pada proposal, tiap tujuan
  lazimnya menjawab satu rumusan masalah; selisih menandakan ada tujuan tanpa pertanyaan atau
  pertanyaan tanpa tujuan
suggested_clarification: >-
  Rumusan masalah mana yang dijawab oleh tiap tujuan, dan apakah ada tujuan yang sebenarnya
  manfaat atau keluaran penelitian?
basis: >-
  Prinsip keselarasan rumusan masalah–tujuan (alignment) pada penulisan proposal; tujuan adalah
  jawaban yang ingin dicapai atas rumusan masalah. Perlu ditinjau dosen metodologi.
references:
  - "Creswell, J. W., & Creswell, J. D. (2018). Research design: Qualitative, quantitative, and mixed methods approaches (5th ed.). SAGE."
  - "Sugiyono. (2019). Metode penelitian kuantitatif, kualitatif, dan R&D. Alfabeta."
suggestions:
  - "Buat tabel pemetaan satu-satu: RQ1 → Tujuan 1, dst."
  - "Tujuan yang tidak menjawab RQ mana pun (mis. 'memberikan rekomendasi') pindahkan ke Manfaat Penelitian atau keluaran."
  - "Bila tujuan itu memang penting, tambahkan rumusan masalah yang sepadan."
check:
  kind: count_match
  a: {types: [research_question], label: rumusan masalah}
  b: {types: [objective], label: tujuan}
examples:
  fires:
    elements:
      - {type: research_question, content: "Bagaimana besaran emisi karbon model BERT?"}
      - {type: objective, content: "Mengukur emisi karbon model BERT."}
      - {type: objective, content: "Memberikan rekomendasi praktik Green AI."}
  quiet:
    elements:
      - {type: research_question, content: "Bagaimana besaran emisi karbon model BERT?"}
      - {type: objective, content: "Mengukur emisi karbon model BERT."}

id: R-RQ-OBJ
priority: high
title: Rumusan masalah belum disertai tujuan penelitian
why_flagged: >-
  Ditemukan rumusan masalah, tetapi tidak ditemukan tujuan penelitian. Setiap rumusan masalah
  biasanya dijawab oleh minimal satu tujuan.
suggested_clarification: Tujuan penelitian mana yang menjawab rumusan masalah ini?
basis: >-
  Rumusan masalah dan tujuan penelitian harus selaras: tiap pertanyaan dijawab oleh tujuan yang sesuai. Perlu ditinjau dosen metodologi.
references:
  - "Creswell, J. W., & Creswell, J. D. (2018). Research design: Qualitative, quantitative, and mixed methods approaches (5th ed.). SAGE."
  - "Sugiyono. (2019). Metode penelitian kuantitatif, kualitatif, dan R&D. Alfabeta."
source_types: [methodology]
directions:
  - option: "Tujuan sudah ada, tetapi dengan judul lain"
    implication: "Judul subbab bisa diselaraskan dengan istilah panduan agar mudah ditemukan pembaca."
  - option: "Tujuan belum dirumuskan"
    implication: "Tiap rumusan masalah butuh tujuan dengan kata kerja yang sepadan (mis. 'bagaimana besaran' → 'mengukur'), lalu dipetakan ke data dan analisis di Bab III."
check:
  kind: requires
  source: {types: [research_question]}
  target: {types: [objective]}
examples:
  fires:
    elements:
      - {type: research_question, content: "Bagaimana kemampuan representasi matematis siswa kelas VIII?", page: 4}
  quiet:
    elements:
      - {type: research_question, content: "Bagaimana kemampuan representasi matematis siswa kelas VIII?", page: 4}
      - {type: objective, content: "Mendeskripsikan kemampuan representasi matematis siswa kelas VIII.", page: 5}
defense_question: "Tujuan penelitian mana yang menjawab “{research_question}”, dan bagaimana Anda tahu tujuan itu tercapai?"

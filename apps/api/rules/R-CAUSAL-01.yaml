# Katalog: docs/alignment-rules.md. Abstrak [3]: pertanyaan kausal diuji dengan desain one-group pre/post-test.
id: R-CAUSAL-01
priority: high
title: Pertanyaan kausal, desain mungkin belum mendukung inferensi kausal
why_flagged: >-
  Pertanyaan atau klaim memakai bahasa sebab-akibat, sedangkan desain yang tercantum
  (mis. one-group pre-test/post-test, survei satu kali, korelasi) umumnya hanya menunjukkan
  perubahan atau hubungan, bukan dampak kausal.
suggested_clarification: >-
  Apakah pertanyaan ini ingin dirumuskan sebagai hubungan/perubahan, atau desain perlu kelompok
  pembanding agar klaim kausal dapat didukung?
basis: >-
  Klaim sebab-akibat butuh desain yang mengendalikan penjelasan alternatif (mis. kelompok pembanding, randomisasi). Desain satu kelompok pre/post, survei satu kali, dan korelasi umumnya hanya menunjukkan perubahan atau hubungan (validitas internal). Perlu ditinjau dosen metodologi.
references:
  - "Campbell, D. T., & Stanley, J. C. (1963). Experimental and quasi-experimental designs for research. Rand McNally."
  - "Shadish, W. R., Cook, T. D., & Campbell, D. T. (2002). Experimental and quasi-experimental designs for generalized causal inference. Houghton Mifflin."
source_types: [methodology]
directions:
  - option: "Mempertahankan pertanyaan sebab-akibat"
    implication: "Desain perlu bisa menyingkirkan penjelasan alternatif: kelompok pembanding (kuasi-eksperimen) atau kontrol ancaman validitas internal. Yang bisa dicek: apakah kelas/kelompok pembanding memungkinkan didapat?"
  - option: "Merumuskan ulang sebagai hubungan atau perubahan"
    implication: "Desain sekarang tetap bisa dipakai; kata kerja di RQ, tujuan, dan kesimpulan ikut bergeser dari 'pengaruh/dampak' ke 'hubungan/perbedaan/perubahan', dan keterbatasan desain dicatat."
check:
  kind: conflict
  a:
    types: [research_question, objective, claim]
    any_terms: [pengaruh, berpengaruh, mempengaruhi, memengaruhi, dampak, efek, efektivitas, menyebabkan, impact, effect, effectiveness, cause]
  b:
    types: [method]
    any_terms: [one group, satu kelompok, pre test post test, pretest posttest, tanpa kelompok kontrol, cross sectional, survei satu kali, korelasi, correlational, korelasional]
examples:
  fires:
    elements:
      - {type: research_question, content: "Bagaimana pengaruh model PBL terhadap kemampuan pemecahan masalah?", page: 5}
      - {type: method, content: "Desain one-group pre-test/post-test.", page: 21}
  quiet:
    elements:
      - {type: research_question, content: "Bagaimana pengaruh model PBL terhadap kemampuan pemecahan masalah?", page: 5}
      - {type: method, content: "Quasi-eksperimen dengan kelompok kontrol (nonequivalent control group design).", page: 21}
defense_question: "Pertanyaan Anda bersifat sebab-akibat, sedangkan desainnya “{method}”. Mengapa desain ini cukup untuk menyimpulkan pengaruh, dan ancaman validitas apa yang Anda kendalikan?"

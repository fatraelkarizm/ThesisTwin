id: R-VAR-INSTR
priority: medium
title: Variabel penelitian belum terhubung ke instrumen
why_flagged: >-
  Ditemukan variabel penelitian, tetapi tidak ditemukan instrumen untuk mengukurnya
  (tes, angket, lembar observasi, pedoman wawancara).
suggested_clarification: Instrumen apa yang dipakai untuk mengukur variabel ini?
basis: >-
  Variabel harus didefinisikan secara operasional dan diukur dengan instrumen tertentu (tes, angket, observasi, atau alat ukur), beserta uji validitas/reliabilitasnya. Perlu ditinjau dosen metodologi.
references:
  - "Sugiyono. (2019). Metode penelitian kuantitatif, kualitatif, dan R&D. Alfabeta."
  - "Creswell, J. W., & Creswell, J. D. (2018). Research design: Qualitative, quantitative, and mixed methods approaches (5th ed.). SAGE."
source_types: [methodology]
directions:
  - option: "Instrumen baku yang sudah ada"
    implication: "Sumber instrumen dan bukti validitas/reliabilitasnya dari penelitian sebelumnya bisa dikutip; kecocokan dengan konteks tetap perlu dicek."
  - option: "Instrumen disusun sendiri"
    implication: "Butuh definisi operasional (indikator, cara ukur, skala data) dan rencana uji validitas serta reliabilitas sebelum dipakai."
  - option: "Variabel diukur dari data yang sudah ada (mis. nilai, log sistem)"
    implication: "Asal data dan cara variabel dihitung dari data itu perlu dijelaskan."
check:
  kind: requires
  source: {types: [variable]}
  target: {types: [instrument]}
examples:
  fires:
    elements:
      - {type: variable, content: "Kemampuan pemecahan masalah matematis.", page: 12}
  quiet:
    elements:
      - {type: variable, content: "Kemampuan pemecahan masalah matematis.", page: 12}
      - {type: instrument, content: "Tes uraian pemecahan masalah 5 soal.", page: 24}
